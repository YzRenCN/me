<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 写实故宫 · 太和殿</title>
<style>

  }
  #loading.hide { opacity: 0; pointer-events: none; }

<body>
<div id="ui">
  <h1>紫禁城 · 太和殿<span>THE HALL OF SUPREME HARMONY</span></h1>
  <p>拖拽旋转 &nbsp;·&nbsp; 滚轮缩放 &nbsp;·&nbsp; 右键平移</p>
</div>
<div id="loading">营 造 中 …</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';

/* ============================================================
   1. 渲染器 / 场景 / 相机
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.62;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc9d7e2, 170, 520);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.5, 3000);
camera.position.set(64, 33, 86);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 10, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 22;
controls.maxDistance = 260;
controls.update();

/* ============================================================
   2. 天空 & 光照
   ============================================================ */
const sky = new Sky();
sky.scale.setScalar(9000);
const skyU = sky.material.uniforms;
skyU.turbidity.value      = 5.0;
skyU.rayleigh.value       = 1.6;
skyU.mieCoefficient.value = 0.006;
skyU.mieDirectionalG.value = 0.83;

const sunDir = new THREE.Vector3();
{
  const phi   = THREE.MathUtils.degToRad(90 - 33);  // 太阳高度角
  const theta = THREE.MathUtils.degToRad(142);       // 方位角
  sunDir.setFromSphericalCoords(1, phi, theta);
  skyU.sunPosition.value.copy(sunDir);
}
scene.add(sky);

// 主光（太阳）
const sunLight = new THREE.DirectionalLight(0xffeecb, 3.6);
sunLight.position.copy(sunDir).multiplyScalar(160);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left   = -75;
sunLight.shadow.camera.right  =  75;
sunLight.shadow.camera.top    =  75;
sunLight.shadow.camera.bottom = -75;
sunLight.shadow.camera.near   = 1;
sunLight.shadow.camera.far    = 420;
sunLight.shadow.bias = -0.0003;
sunLight.shadow.normalBias = 0.035;
scene.add(sunLight);
scene.add(sunLight.target);

// 天光 / 地面反弹
scene.add(new THREE.HemisphereLight(0xbfd6f2, 0x9c8a70, 1.35));

// 补光（冷色，模拟天空漫反射）
const fillLight = new THREE.DirectionalLight(0x9db8e0, 0.55);
fillLight.position.set(-80, 50, -70);
scene.add(fillLight);

/* ============================================================
   3. 程序化纹理工具
   ============================================================ */
function canvasTexture(w, h, draw, rx = 1, ry = 1) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  draw(ctx, w, h);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(rx, ry);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return tex;
}

/* --- 广场石板 --- */
const texStoneFloor = canvasTexture(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#8e887c';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 12000; i++) {
    const g = 105 + Math.random() * 70;
    ctx.fillStyle = `rgba(${g|0},${(g-5)|0},${(g-13)|0},${Math.random() * 0.28})`;
    ctx.fillRect(Math.random() * w, Math.random() * h, 2.5, 2.5);
  }
  const n = 4, s = w / n;
  ctx.strokeStyle = 'rgba(48,44,38,0.55)';
  ctx.lineWidth = 2.5;
  for (let i = 0; i <= n; i++) {
    ctx.beginPath(); ctx.moveTo(i * s, 0); ctx.lineTo(i * s, h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * s); ctx.lineTo(w, i * s); ctx.stroke();
  }
}, 60, 60);

/* --- 汉白玉 --- */
const texMarble = canvasTexture(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#e8e3d6';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) {
    const g = 200 + Math.random() * 55;
    ctx.fillStyle = `rgba(${g|0},${(g-4)|0},${(g-12)|0},${Math.random() * 0.35})`;
    ctx.fillRect(Math.random() * w, Math.random() * h, 2, 2);
  }
  ctx.strokeStyle = 'rgba(150,143,128,0.28)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 26; i++) {
    ctx.beginPath();
    let x = Math.random() * w, y = Math.random() * h;
    ctx.moveTo(x, y);
    for (let k = 0; k < 5; k++) {
      x += (Math.random() - 0.5) * 70;
      y += (Math.random() - 0.5) * 70;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}, 2, 2);

/* --- 朱红宫墙 --- */
const texWall = canvasTexture(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#9c2b1c';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) {
    const a = Math.random() * 0.09;
    ctx.fillStyle = Math.random() > 0.5
      ? `rgba(255,175,135,${a})` : `rgba(42,4,0,${a})`;
    ctx.fillRect(Math.random() * w, Math.random() * h, 3, 3);
  }
}, 5, 2.4);

/* --- 黄琉璃瓦（瓦垄） --- */
const texGlazedTile = canvasTexture(128, 256, (ctx, w, h) => {
  const g = ctx.createLinearGradient(0, 0, w, 0);
  g.addColorStop(0.00, '#8f6a10');
  g.addColorStop(0.22, '#d9a832');
  g.addColorStop(0.42, '#ffd75a');
  g.addColorStop(0.58, '#f2c23c');
  g.addColorStop(0.80, '#b8891a');
  g.addColorStop(1.00, '#7a580a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  // 瓦垄之间的暗缝
  ctx.fillStyle = 'rgba(70,44,0,0.42)';
  ctx.fillRect(w * 0.44, 0, w * 0.09, h);
  // 高光
  ctx.fillStyle = 'rgba(255,255,225,0.30)';
  ctx.fillRect(w * 0.20, 0, w * 0.05, h);
  // 横向瓦片分段
  for (let y = 0; y < h; y += 30) {
    ctx.fillStyle = 'rgba(92,60,0,0.30)';
    ctx.fillRect(0, y, w, 2.5);
  }
}, 1, 1);

/* --- 隔扇门窗（棂心） --- */
const texLattice = canvasTexture(256, 512, (ctx, w, h) => {
  ctx.fillStyle = '#3a1a10';
  ctx.fillRect(0, 0, w, h);
  // 金色棂条
  ctx.strokeStyle = '#c9a227';
  ctx.lineWidth = 5;
  for (let x = 0; x <= w; x += 42) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  for (let y = 0; y <= h; y += 46) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  // 竖框（每扇门）
  ctx.strokeStyle = '#8f1d12';
  ctx.lineWidth = 12;
  for (let x = 0; x <= w; x += 128) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  // 上部横披
  ctx.fillStyle = 'rgba(20,8,4,0.55)';
  ctx.fillRect(0, 0, w, 60);
}, 7, 1.6);

/* ============================================================
   4. 材质
   ============================================================ */
const M = {
  floor:  new THREE.MeshStandardMaterial({ map: texStoneFloor, roughness: 0.95, metalness: 0.0 }),
  marble: new THREE.MeshStandardMaterial({ map: texMarble, roughness: 0.82, metalness: 0.03 }),
  wall:   new THREE.MeshStandardMaterial({ map: texWall, roughness: 0.72, metalness: 0.04 }),
  pillar: new THREE.MeshStandardMaterial({ color: 0xa52a19, roughness: 0.55, metalness: 0.08 }),
  roof:   new THREE.MeshStandardMaterial({
            map: texGlazedTile, roughness: 0.34, metalness: 0.42,
            side: THREE.DoubleSide
          }),
  ridge:  new THREE.MeshStandardMaterial({ color: 0x6e4e08, roughness: 0.45, metalness: 0.55 }),
  gold:   new THREE.MeshStandardMaterial({ color: 0xc9a227, roughness: 0.28, metalness: 0.9 }),
  dark:   new THREE.MeshStandardMaterial({ color: 0x1c1410, roughness: 0.9 }),
  lattice:new THREE.MeshStandardMaterial({ map: texLattice, roughness: 0.7, metalness: 0.15 }),
};

/* ============================================================
   5. 地面广场
   ============================================================ */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), M.floor);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================
   6. 屋顶几何体生成（庑殿顶 / 四阿顶）
   ============================================================ */
function buildSurface(nu, nv, fn, uRep, vRep) {
  const pos = [], uv = [], idx = [];
  for (let j = 0; j <= nv; j++) {
    const v = j / nv;
    for (let i = 0; i <= nu; i++) {
      const u = -1 + (2 * i) / nu;
      const p = fn(u, v);
      pos.push(p.x, p.y, p.z);
      uv.push((i / nu) * uRep, v * vRep);
    }
  }
  for (let j = 0; j < nv; j++) {
    for (let i = 0; i < nu; i++) {
      const a = j * (nu + 1) + i;
      const b = a + 1;
      const c = a + nu + 1;
      const d = c + 1;
      idx.push(a, b, c, b, d, c);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/**
 * 创建庑殿顶
 * @param {number} w 屋顶宽（x 方向）
 * @param {number} d 屋顶深（z 方向）
 * @param {number} h 屋顶高
 * @param {number} lift 翘角抬升量
 */
function createHipRoof(w, d, h, lift = 1.5) {
  const group = new THREE.Group();
  const rHalf = Math.max(0.8, (w - d) / 2);   // 正脊半长
  const nu = 26, nv = 14;
  const curvePow = 0.72;

  const yOf = (u, v) =>
    h * Math.pow(v, curvePow) +
    lift * Math.pow(Math.abs(u), 6) * Math.pow(1 - v, 2.2);

  // 前坡 (+z)
  group.add(new THREE.Mesh(
    buildSurface(nu, nv, (u, v) => new THREE.Vector3(
      u * (w / 2 * (1 - v) + rHalf * v),
      yOf(u, v),
      (d / 2) * (1 - v)
    ), w / 2.3, 3.4),
    M.roof
  ));

  // 后坡 (-z)
  group.add(new THREE.Mesh(
    buildSurface(nu, nv, (u, v) => new THREE.Vector3(
      u * (w / 2 * (1 - v) + rHalf * v),
      yOf(u, v),
      -(d / 2) * (1 - v)
    ), w / 2.3, 3.4),
    M.roof
  ));

  // 右坡 (+x)
  group.add(new THREE.Mesh(
    buildSurface(nu, nv, (u, v) => new THREE.Vector3(
      (w / 2) * (1 - v) + rHalf * v,
      yOf(u, v),
      -u * (d / 2) * (1 - v)
    ), d / 2.3, 3.4),
    M.roof
  ));

  // 左坡 (-x)
  group.add(new THREE.Mesh(
    buildSurface(nu, nv, (u, v) => new THREE.Vector3(
      -((w / 2) * (1 - v) + rHalf * v),
      yOf(u, v),
      u * (d / 2) * (1 - v)
    ), d / 2.3, 3.4),
    M.roof
  ));

  // ---- 正脊 ----
  const ridge = new THREE.Mesh(
    new THREE.BoxGeometry(rHalf * 2 + 1.0, 1.05, 1.05),
    M.ridge
  );
  ridge.position.set(0, h + 0.42, 0);
  ridge.castShadow = true;
  group.add(ridge);

  // 正脊两端吻兽
  const beastGeo = new THREE.BoxGeometry(1.0, 1.5, 1.2);
  [-1, 1].forEach(s => {
    const b = new THREE.Mesh(beastGeo, M.ridge);
    b.position.set(s * (rHalf + 0.5), h + 0.95, 0);
    b.rotation.z = s * 0.12;
    b.castShadow = true;
    group.add(b);
    // 剑把
    const sword = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.6, 6), M.gold);
    sword.position.set(s * (rHalf + 0.5), h + 1.9, 0);
    group.add(sword);
  });

  // ---- 垂脊（四条）----
  const corners = [
    [ w / 2,  d / 2], [ w / 2, -d / 2],
    [-w / 2,  d / 2], [-w / 2, -d / 2],
  ];
  corners.forEach(([cx, cz]) => {
    const startX = Math.sign(cx) * rHalf;
    const p0 = new THREE.Vector3(startX, h + 0.15, 0);
    const p2 = new THREE.Vector3(cx, lift + 0.15, cz);
    const mid = new THREE.Vector3(
      (p0.x + p2.x) * 0.5,
      h * 0.60 + lift * 0.22,
      (p0.z + p2.z) * 0.5
    );
    const curve = new THREE.QuadraticBezierCurve3(p0, mid, p2);
    const tube = new THREE.Mesh(
      new THREE.TubeGeometry(curve, 24, 0.28, 7, false),
      M.ridge
    );
    tube.castShadow = true;
    group.add(tube);
  });

  return group;
}

/* ============================================================
   7. 台基（三层须弥座）+ 望柱 + 台阶
   ============================================================ */
const hall = new THREE.Group();
scene.add(hall);

const tiers = [
  { w: 46.0, d: 34.0, h: 2.2, y: 0.0 },
  { w: 42.4, d: 30.6, h: 2.0, y: 2.2 },
  { w: 38.8, d: 27.2, h: 1.8, y: 4.2 },
];
const BASE_TOP = 6.0;

tiers.forEach(t => {
  const box = new THREE.Mesh(new THREE.BoxGeometry(t.w, t.h, t.d), M.marble);
  box.position.y = t.y + t.h / 2;
  box.castShadow = true;
  box.receiveShadow = true;
  hall.add(box);

  // 上沿压边
  const cap = new THREE.Mesh(
    new THREE.BoxGeometry(t.w + 0.5, 0.28, t.d + 0.5), M.marble
  );
  cap.position.y = t.y + t.h + 0.14;
  cap.castShadow = true;
  cap.receiveShadow = true;
  hall.add(cap);
});

// ---- 望柱 + 栏板 ----
const postGeo = new THREE.BoxGeometry(0.42, 1.25, 0.42);
const headGeo = new THREE.SphereGeometry(0.26, 8, 6);
const panelGeoCache = {};

function addBalustrade(w, d, y, segments) {
  const halfW = w / 2, halfD = d / 2;
  const edges = [
    { a: new THREE.Vector3(-halfW, 0,  halfD), b: new THREE.Vector3( halfW, 0,  halfD) },
    { a: new THREE.Vector3( halfW, 0,  halfD), b: new THREE.Vector3( halfW, 0, -halfD) },
    { a: new THREE.Vector3( halfW, 0, -halfD), b: new THREE.Vector3(-halfW, 0, -halfD) },
    { a: new THREE.Vector3(-halfW, 0, -halfD), b: new THREE.Vector3(-halfW, 0,  halfD) },
  ];

  edges.forEach((e, ei) => {
    const isLong = ei === 0 || ei === 2;
    const count = isLong ? segments : Math.round(segments * (d / w));
    const dir = new THREE.Vector3().subVectors(e.b, e.a);
    const len = dir.length();

    for (let i = 0; i <= count; i++) {
      const t = i / count;
      const p = new THREE.Vector3().copy(e.a).addScaledVector(dir, t);
      const post = new THREE.Mesh(postGeo, M.marble);
      post.position.set(p.x, y + 0.78, p.z);
      post.castShadow = true;
      hall.add(post);

      const head = new THREE.Mesh(headGeo, M.marble);
      head.position.set(p.x, y + 1.55, p.z);
      head.castShadow = true;
      hall.add(head);
    }

    // 栏板
    const key = `${len.toFixed(2)}_${count}`;
    if (!panelGeoCache[key]) {
      panelGeoCache[key] = new THREE.BoxGeometry(len, 0.62, 0.26);
    }
    const panel = new THREE.Mesh(panelGeoCache[key], M.marble);
    const mid = new THREE.Vector3().copy(e.a).addScaledVector(dir, 0.5);
    panel.position.set(mid.x, y + 0.62, mid.z);
    panel.lookAt(mid.x + dir.z, y + 0.62, mid.z - dir.x);
    panel.castShadow = true;
    hall.add(panel);
  });
}

addBalustrade(tiers[0].w, tiers[0].d, 2.48, 16);
addBalustrade(tiers[1].w, tiers[1].d, 4.48, 15);
addBalustrade(tiers[2].w, tiers[2].d, 6.28, 14);

// ---- 正面台阶（丹陛）----
const stepGroup = new THREE.Group();
const STEP_N = 12, STEP_H = BASE_TOP / STEP_N, STEP_D = 0.72;
for (let i = 0; i < STEP_N; i++) {
  const s = new THREE.Mesh(
    new THREE.BoxGeometry(15, STEP_H + 0.06, STEP_D + 0.06),
    M.marble
  );
  s.position.set(0, i * STEP_H + STEP_H / 2, 17 + (STEP_N - 1 - i) * STEP_D + STEP_D / 2);
  s.castShadow = true;
  s.receiveShadow = true;
  stepGroup.add(s);
}
hall.add(stepGroup);

// 丹陛御路（中间雕龙石）
const imperialRoad = new THREE.Mesh(
  new THREE.BoxGeometry(4.2, BASE_TOP + 0.05, STEP_N * STEP_D + 0.4),
  new THREE.MeshStandardMaterial({ map: texMarble, color: 0xf2ece0, roughness: 0.7 })
);
imperialRoad.position.set(0, BASE_TOP / 2, 17 + (STEP_N * STEP_D) / 2);
imperialRoad.rotation.x = -Math.atan2(BASE_TOP, STEP_N * STEP_D);
imperialRoad.castShadow = true;
imperialRoad.receiveShadow = true;
hall.add(imperialRoad);

/* ============================================================
   8. 太和殿主体
   ============================================================ */
const BODY_W = 30, BODY_D = 17, BODY_H = 10.5;
const BODY_Y = BASE_TOP;          // 6.0

const bodyGroup = new THREE.Group();
bodyGroup.position.y = BODY_Y;
hall.add(bodyGroup);

// ---- 墙体 ----
const wallBox = new THREE.Mesh(
  new THREE.BoxGeometry(BODY_W - 1.6, BODY_H, BODY_D - 1.4),
  M.wall
);
wallBox.position.set(0, BODY_H / 2, 0);
wallBox.castShadow = true;
wallBox.receiveShadow = true;
bodyGroup.add(wallBox);

// ---- 隔扇门窗（正面）----
const doorPanel = new THREE.Mesh(
  new THREE.PlaneGeometry(BODY_W - 3.0, BODY_H - 2.4),
  M.lattice
);
doorPanel.position.set(0, BODY_H / 2 - 0.6, (BODY_D - 1.4) / 2 + 0.06);
doorPanel.castShadow = true;
bodyGroup.add(doorPanel);

// ---- 檐柱（正面 8 根 + 两侧各 4 根 + 背面 6 根）----
const PILLAR_R = 0.62;
const pillarGeo = new THREE.CylinderGeometry(PILLAR_R, PILLAR_R * 1.08, BODY_H, 16);
const baseGeo = new THREE.CylinderGeometry(PILLAR_R * 1.5, PILLAR_R * 1.6, 0.5, 16);

function addPillar(x, z) {
  const p = new THREE.Mesh(pillarGeo, M.pillar);
  p.position.set(x, BODY_H / 2, z);
  p.castShadow = true;
  p.receiveShadow = true;
  bodyGroup.add(p);

  const b = new THREE.Mesh(baseGeo, M.marble);
  b.position.set(x, 0.25, z);
  b.castShadow = true;
  bodyGroup.add(b);
}

// 正面
const FRONT_Z = (BODY_D - 1.4) / 2 + 1.35;
for (let i = 0; i < 8; i++) {
  const x = -13.3 + i * (26.6 / 7);
  addPillar(x, FRONT_Z);
}
// 背面
for (let i = 0; i < 6; i++) {
  const x = -12 + i * (24 / 5);
  addPillar(x, -FRONT_Z);
}
// 两侧
[-1, 1].forEach(s => {
  for (let i = 0; i < 4; i++) {
    const z = -6.2 + i * (12.4 / 3);
    addPillar(s * (BODY_W / 2 - 1.1), z);
  }
});

// ---- 额枋（柱顶横梁）----
const beamMat = new THREE.MeshStandardMaterial({ color: 0x2f6b58, roughness: 0.6, metalness: 0.1 });
const beamFront = new THREE.Mesh(
  new THREE.BoxGeometry(BODY_W - 1.0, 0.95, 0.9), beamMat
);
beamFront.position.set(0, BODY_H - 0.55, FRONT_Z);
beamFront.castShadow = true;
bodyGroup.add(beamFront);

const beamBack = beamFront.clone();
beamBack.position.z = -FRONT_Z;
bodyGroup.add(beamBack);

[-1, 1].forEach(s => {
  const beam = new THREE.Mesh(
    new THREE.BoxGeometry(0.9, 0.95, BODY_D - 1.2), beamMat
  );
  beam.position.set(s * (BODY_W / 2 - 1.1), BODY_H - 0.55, 0);
  beam.castShadow = true;
  bodyGroup.add(beam);
});

// ---- 斗拱（简化为小方块阵列）----
const dougongGeo = new THREE.BoxGeometry(0.46, 0.46, 0.46);
const dougongMat = new THREE.MeshStandardMaterial({ color: 0x3e7f68, roughness: 0.55, metalness: 0.15 });
for (let i = 0; i < 26; i++) {
  const x = -14 + i * (28 / 25);
  const dg = new THREE.Mesh(dougongGeo, dougongMat);
  dg.position.set(x, BODY_H + 0.32, FRONT_Z);
  dg.castShadow = true;
  bodyGroup.add(dg);

  const dg2 = new THREE.Mesh(dougongGeo, dougongMat);
  dg2.position.set(x, BODY_H + 0.32, -FRONT_Z);
  bodyGroup.add(dg2);
}

/* ============================================================
   9. 屋顶
   ============================================================ */
const roof = createHipRoof(41, 26, 9.2, 1.9);
roof.position.y = BODY_Y + BODY_H + 0.9;
hall.add(roof);

/* ============================================================
   10. 两侧廊庑（配殿，简化）
   ============================================================ */
function createWingHall(xPos, rotY) {
  const g = new THREE.Group();
  g.position.set(xPos, 0, 0);
  g.rotation.y = rotY;

  const plinth = new THREE.Mesh(new THREE.BoxGeometry(58, 1.6, 12), M.marble);
  plinth.position.y = 0.8;
  plinth.castShadow = true;
  plinth.receiveShadow = true;
  g.add(plinth);

  const wall = new THREE.Mesh(new THREE.BoxGeometry(55, 6.5, 8.5), M.wall);
  wall.position.y = 1.6 + 3.25;
  wall.castShadow = true;
  wall.receiveShadow = true;
  g.add(wall);

  const r = createHipRoof(59, 12, 4.6, 1.1);
  r.position.y = 1.6 + 6.5;
  g.add(r);

  return g;
}

hall.add(createWingHall(-58, 0));
hall.add(createWingHall( 58, 0));

/* ============================================================
   11. 交互 & 渲染循环
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // 极轻微的相机呼吸感
  controls.update();

  renderer.render(scene, camera);
}

// 隐藏 loading
setTimeout(() => {
  document.getElementById('loading').classList.add('hide');
}, 400);

animate();
</script>
